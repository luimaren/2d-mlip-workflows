# Configuracion del workflow (rutas relativas a la carpeta donde esta este fichero)

[paths]
structures = structures          # xyz de entrada: case_XX_<nombre>.xyz (salida de make_vacancies.py)
cases      = cases               # aqui se crea una carpeta por caso
pseudos    = pseudos             # los UPF se copian a cada carpeta de calculo (pseudo_dir = './')
dataset    = dataset             # recopilacion de xyz (trayectorias de relax) para el dataset

[relax]
input_template = templates/input_relax.in
job_template   = templates/job_relax.sh
time           = 24:00:00        # sustituye a @TIME@ en el job (ver README: el 3x3 sera mas lento que el 2x2)

[nvt]
input_template = templates/input_nvt.in
job_template   = templates/job_nvt.sh
time           = 72:00:00
temperatures   = 1000            # K, separadas por espacios: una carpeta nvt_T<T>K por temperatura
nstep          =                 # vacio = el nstep del template

[slurm]
sbatch = sbatch
squeue = squeue
