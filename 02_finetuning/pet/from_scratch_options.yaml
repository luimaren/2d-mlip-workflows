seed: 42

architecture:
  name: pet

  training:
    batch_size: 2
    num_epochs: 100
    learning_rate: 1e-3
    

# this needs specifying based on the specific dataset
training_set:
  systems: 
    read_from: "Dataset/BGDY/data_train_1.xyz"  # path to the finetuning dataset
    length_unit: angstrom
  targets:
    energy:
      key: "energy-corrected"  # name of the target value
      unit: "eV"

validation_set:
  systems: 
    read_from: "Dataset/BGDY/data_val_1.xyz"
    length_unit: angstrom
  targets:
    energy:
      key: "energy-corrected"
      unit: "eV"

test_set:
  systems: 
    read_from: "Dataset/BGDY/data_test_1.xyz"
    length_unit: angstrom
  targets:
    energy:
      key: "energy-corrected"
      unit: "eV"
