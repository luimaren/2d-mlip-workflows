
name: "FT_MACE_v31"
seed: 377
model: "MACE"

# Dataset

train_file: "train_v32_filtrado.xyz"
valid_fraction: 0.10
test_file: "test_v32_filtrado_total.xyz"
energy_key: "energy_qe"
forces_key: "forces_qe"
E0s: "{5:-149.49305965, 6:-242.95557274}"
#E0s: "estimated"


# Foundational model

foundation_model: "./mace-mh-1.model"
foundation_head: "oc20_usemppbe"
multiheads_finetuning: False

# Optimization

batch_size: 4
valid_batch_size: 4
max_num_epochs: 200
lr: 1e-3
weight_decay: 0.0
clip_grad: 1.0
optimizer: "adamw"

# Loss

forces_weight: 100.0
energy_weight: 10.0
stress_weight: 0.0
compute_stress: False

# Numerical stability

ema: True
ema_decay: 0.999
swa: False
default_dtype: float64

# Reporting / checkpoints

error_table: "PerAtomRMSE"
plot: True
plot_frequency: 0
restart_latest: True

# Data files

model_dir:       "MACE_models_BGDY3x3_FTv31"
log_dir:         "MACE_models_BGDY3x3_FTv31"
checkpoints_dir: "MACE_models_BGDY3x3_FTv31/models"
results_dir:     "MACE_models_BGDY3x3_FTv31"
device: cuda
